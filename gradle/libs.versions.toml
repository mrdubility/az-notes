# ============================================================
# Az Notes - 统一版本目录 (Version Catalog)
# 所有依赖版本集中在此，方便在 GitHub Actions 上按需升级。
# 若云端编译报“版本不兼容”，优先在此处对齐 AGP / Kotlin / Compose BOM / 渲染库。
# ============================================================

[versions]
# --- 构建工具链 ---
# 兼容性说明: markdown 渲染库锁定 0.35.0，其 kotlin-stdlib 恰为 2.1.21，与本项目 Kotlin 工具链精确对齐
# (0.39.0 会把 stdlib 顶到 2.3.0，2.1.21 编译器无法读取其元数据，故不采用)。
# 因此本文件整体对齐一套 2025 年中期的稳定组合。
agp = "8.11.1"
kotlin = "2.1.21"
ksp = "2.1.21-2.0.2"
composeBom = "2025.06.01"
hilt = "2.56"
# Hilt 的 AndroidX 编译 (hilt-navigation-compose) 版本
hiltNavigationCompose = "1.2.0"
room = "2.7.1"

# --- AndroidX / 官方库 ---
coreKtx = "1.16.0"
appcompat = "1.7.0"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
navigationCompose = "2.8.9"
datastore = "1.1.2"
workManager = "2.10.2"
securityCrypto = "1.1.0-alpha07"
splashscreen = "1.0.1"

# --- 三方库 ---
coil = "3.2.0"
markdownRenderer = "0.35.0"
# JetBrains Markdown 解析器：与渲染库 0.35.0 的内部解析链同版本（GFM），
# 供 HeadingExtractor 提取 AST 大纲，保证块序号与渲染一一对应。
jetbrainsMarkdown = "0.7.3"
# 同步引擎 (M3)：直接用 OkHttp 实现 WebDAV 原语（PROPFIND/GET/PUT/DELETE/MKCOL）。
# 不引入 dav4jvm：其 4.x 需要 core library desugaring，云编译链路风险高；
# OkHttp（纯 JVM，免脱糖）已覆盖 M3 所需全部协议能力。
okhttp = "4.12.0"

# --- 编译目标 ---
compileSdk = "35"
targetSdk = "35"
minSdk = "26"


[libraries]
# --- AndroidX 基础 ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# --- Compose (BOM 统一版本) ---
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- 生命周期 / 导航 ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# --- 数据: Room / DataStore / 加密偏好 ---
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# --- 后台任务 ---
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# --- DI (Hilt) ---
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- 图片加载 (Coil 3) ---
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }

# --- Markdown 渲染 ---
markdown-renderer = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "markdownRenderer" }
markdown-renderer-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
jetbrains-markdown = { group = "org.jetbrains", name = "markdown", version.ref = "jetbrainsMarkdown" }

# --- 同步 (M3, WebDAV) ---
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# --- 测试 ---
junit = { group = "junit", name = "junit", version = "4.13.2" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version = "1.10.2" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

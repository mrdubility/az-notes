name: Build Android APK

# 纯云端编译：本机无需 Android 环境，推送到 GitHub 即自动构建 Debug APK。
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle 直接安装指定版本 Gradle，因此本仓库无需提交 gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Print toolchain versions
        run: |
          java -version
          gradle --version

      - name: Assemble Debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # 失败关键行输出为 annotation（匿名可经 REST API 读取，便于快速定位）：
            # 编译/资源错误（Kotlin "e: file"、AAPT2 大写 "ERROR:"）与 Gradle 失败段
            echo "===== failure annotations ====="
            grep -E "^(e: |error:)|e: file|ERROR:|AAPT: error" build.log | head -35 | while IFS= read -r line; do
              echo "::error::$line"
            done
            awk '/^FAILURE:|^> Task .* FAILED|What went wrong|Script compilation|Caused by:/' build.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "===== tail of build log ====="
            tail -80 build.log
          fi
          exit $status

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: az-notes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

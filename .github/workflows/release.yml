# 正式签名发布：从 GitHub Secrets 注入签名密钥，构建正式签名的 Release APK。
#
# 两种触发方式（均需主动发起，日常 push 不会触发本工作流）：
# 1. workflow_dispatch（手动运行）：构建并上传 APK 到 Actions 产物（artifact），
#    不创建 Release —— 保留"从 Actions 取产物"模式。
# 2. push tag v*（如 v1.0.0）：构建 + 上传产物 + 创建 GitHub Release。
#    只有显式推 tag 才会发布到 Release。
#
# 前置配置（仓库 Settings）：
#   - Secrets：RELEASE_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD /
#     RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
#   - Actions → General → Workflow permissions 建议设为 Read and write
#     （本文件已声明 contents: write，若创建 Release 报 403 再检查此项）
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Assemble Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle 直接安装指定版本 Gradle，因此本仓库无需提交 gradle-wrapper.jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::未配置 RELEASE_KEYSTORE_BASE64 Secret，无法构建签名 Release APK"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          ls -l "$RUNNER_TEMP/signing/release.jks"

      - name: Assemble Release APK
        env:
          AZ_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/release.jks
          AZ_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          AZ_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          AZ_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # 把编译错误行输出为 annotation（无需登录即可通过 REST API 读取），便于快速定位
            echo "===== compile errors ====="
            grep -E "^(e: |error:)|e: file" build.log | head -50 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "===== tail of build log ====="
            tail -80 build.log
          fi
          exit $status

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          # 取最新 build-tools 的 apksigner 校验签名并打印证书指纹；未找到则仅告警不失败
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -30
          else
            echo "::warning::apksigner not found, skip signature verification"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: az-notes-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 仅推 tag（如 v1.0.0）时创建 GitHub Release；手动运行只产 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
